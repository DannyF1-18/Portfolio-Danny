 <section class="contact" method="post" action="../PHP/traitement_contact.php">
            <h1>CONTACT ME</h1>
            <p class="contact-description">Une question, un projet ou une proposition ?<br>
                N'hésitez pas à me contacter.</p>

            <!-- FORMULAIRE -->
            <form id="form-contact" method="post" action="../PHP/traitement_contact.php">
                <div class="champ">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom"  required>
                </div>

                <div class="champ">
                    <label for="email">Email</label>
                    <input type="email" id="email"  name="email"  placeholder="Votre adresse email" required>
                </div>

                <div class="champ">
                    <label for="sujet">Sujet</label>
                    <select id="sujet" name="sujet" required>
                        <option value="">Choisissez un sujet</option>
                        <option value="professionnel">Proposition professionnelle</option>
                        <option value="projet">Collaboration / Projet</option>
                        <option value="question">Question</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="champ">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Écrivez votre message..." required></textarea>
                </div>
                <button type="submit" class="btn btn-bleu">Envoyer le message</button>
                <p id="message-formulaire" aria-live="polite"></p>
            </form>
        </section>
